name: CI — Campus Connect

on:
  push:
    branches: [ develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore CampusConnect.slnx

      - name: Compilar solucion
        run: dotnet build CampusConnect.slnx --no-restore --configuration Release

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test CampusConnect.Tests/CampusConnect.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=resultados.trx"

      - name: Publicar resultados de pruebas
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados xUnit
          path: '**/resultados.trx'
          reporter: dotnet-trx
