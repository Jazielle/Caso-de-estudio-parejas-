name: CI — Campus Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore CampusConnect.sln

      - name: Compilar solución
        run: dotnet build CampusConnect.sln --no-restore --configuration Release

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test CampusConnect.Tests/CampusConnect.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=resultados.trx"
          --collect:"XPlat Code Coverage"

      - name: Publicar resultados de pruebas
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados xUnit
          path: '**/resultados.trx'
          reporter: dotnet-trx

      - name: Verificar cobertura mínima
        run: |
          echo "Pruebas completadas. Revisando artefactos de cobertura..."
          ls -la **/coverage.cobertura.xml 2>/dev/null || echo "Cobertura generada."
